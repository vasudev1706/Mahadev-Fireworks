```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Image Manager</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .product {
            background: white;
            padding: 20px;
            margin: 15px auto;
            max-width: 900px;
            border-radius: 10px;
        }

        .product-info {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border: 1px solid #ddd;
        }

        .no-image {
            width: 150px;
            height: 150px;
            border: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h1>Product Image Manager</h1>

    {% for product in products %}

    <div class="product">

        <div class="product-info">

            {% if product.image %}

                <img
                    src="{{ url_for(
                        'static',
                        filename='images/' + product.image
                    ) }}"
                >

            {% else %}

                <div class="no-image">
                    No Image
                </div>

            {% endif %}


            <div>

                <h2>
                    {{ product.id }}.
                    {{ product.name }}
                </h2>

                <p>
                    <b>Category:</b>
                    {{ product.category }}
                </p>

                <p>
                    <b>Price:</b>
                    ₹{{ product.price }}
                </p>


                <form
                    action="{{ url_for(
                        'upload_image',
                        product_id=product.id
                    ) }}"
                    method="POST"
                    enctype="multipart/form-data"
                >

                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                        required
                    >

                    <br><br>

                    <button type="submit">

                        {% if product.image %}
                            Replace Image
                        {% else %}
                            Upload Image
                        {% endif %}

                    </button>

                </form>

            </div>

        </div>

    </div>

    {% endfor %}

</body>

</html>
```
